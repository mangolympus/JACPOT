function visibleComplianceColumns(period) {
  const ids = ['gstr1', 'gstr3b'];
  if (isQuarterMonth(period.m)) { ids.push('tds24q', 'tds26q'); }
  ids.push('rera', 'epfesic');
  COMPLIANCE_MASTER.forEach(c => {
    if (ids.includes(c.id)) return;
    if (INSTANCES.some(i => i.complianceId === c.id && periodKey(i.period) === periodKey(period))) ids.push(c.id);
  });
  return ids.map(id => complianceById(id));
}
function cellForClientCompliance(client, compliance, period) {
  if (!isApplicable(client, compliance)) return { kind: 'na' };
  const inst = INSTANCES.find(i => i.clientCode === client.code && i.complianceId === compliance.id && periodKey(i.period) === periodKey(period));
  if (!inst) return { kind: 'notdue' };
  return { kind: 'instance', instance: inst };
}

/* ---------- KPIs / DASHBOARD AGGREGATES ---------- */
function computeKPIs(period) {
  const rows = applyScopeFilters(instancesForPeriod(period));
  const buckets = { filed:0, inprogress:0, datapending:0, overdue:0, actionreq:0 };
  rows.forEach(inst => { const b = kpiBucket(inst); if (b && buckets.hasOwnProperty(b)) buckets[b]++; });
  return { buckets, total: rows.length, clientCount: CLIENT_MASTER.filter(c => matchesOffice(c)).length };
}
function computeHealthScore(kpis) {
  const { buckets, total } = kpis;
  if (total === 0) return 100;
  const filedRatio = buckets.filed / total;
  const overdueRatio = buckets.overdue / total;
  const dataPendingRatio = buckets.datapending / total;
  const actionRatio = buckets.actionreq / total;
  const score = 100 * (0.4 * filedRatio + 0.25 * (1 - overdueRatio) + 0.2 * (1 - dataPendingRatio) + 0.15 * (1 - actionRatio));
  return Math.round(Math.max(0, Math.min(100, score)));
}
function priorityItems(period) {
  const items = [];
  applyScopeFilters(instancesForPeriod(period)).forEach(inst => {
    const s = deriveOverallStatus(inst);
    const d = diffDays(new Date(inst.dueDate), TODAY);
    const isDueSoon = d >= 0 && d <= 3 && s.key !== 'filed';
    if (['overdue', 'datapending', 'actionreq'].includes(s.key) || isDueSoon) {
      const client = clientByCode(inst.clientCode);
      const compliance = complianceById(inst.complianceId);
      const risk = computeClientRisk(client.code, inst.period, INSTANCES, DEMANDS, NOTICES);
      items.push({ kind:'instance', instanceId: inst.id, client, label: compliance.name, dueDate: inst.dueDate, status: s, spoc: client.spoc, nextAction: inst.nextAction, nextActionDate: inst.nextActionDate, risk: risk.level, riskScore: risk.score });
    }
  });
  NOTICES.filter(n => n.status === 'Open').forEach(n => {
    const client = clientByCode(n.client);
    if (!matchesOffice(client)) return;
    const risk = computeClientRisk(client.code, period, INSTANCES, DEMANDS, NOTICES);
    items.push({ kind:'notice', noticeId: n.id, client, label: `Notice — ${n.subject}`, dueDate: n.responseDue, status: { key:'actionreq', label:'Response due' }, spoc: client.spoc, nextAction:'Respond to notice', nextActionDate: n.responseDue, risk: risk.level, riskScore: risk.score });
  });
  const order = { Critical:0, High:1, Medium:2, Low:3 };
  items.sort((a, b) => {
    if (order[a.risk] !== order[b.risk]) return order[a.risk] - order[b.risk];
    return diffDays(new Date(a.dueDate), TODAY) - diffDays(new Date(b.dueDate), TODAY);
  });
  return items;
}
function todaysActionCounts(period) {
  const rows = applyScopeFilters(instancesForPeriod(period));
  let overdue = 0, dueToday = 0, due3 = 0, dataFollowups = 0, followupsToday = 0;
  rows.forEach(inst => {
    const d = diffDays(new Date(inst.dueDate), TODAY);
    const s = deriveOverallStatus(inst);
    if (s.key === 'overdue') overdue++;
    else if (d === 0 && s.key !== 'filed') dueToday++;
    else if (d > 0 && d <= 3 && s.key !== 'filed') due3++;
    if (s.key === 'datapending') dataFollowups++;
    if (inst.nextActionDate === isoDate(TODAY)) followupsToday++;
  });
  return { overdue, dueToday, due3, dataFollowups, followupsToday };
}

/* ---------- DASHBOARD AGGREGATIONS (view switcher + charts) ---------- */
// Real trend vs the previous period — returns null (no arrow shown) when the
// previous period genuinely has no data to compare against, rather than
// fabricating a percentage.
function kpiTrend(bucket) {
  const prevPeriod = shiftPeriod(state.period, -1);
  if (!INSTANCES.some(i => periodKey(i.period) === periodKey(prevPeriod))) return null;
  const curKpis = computeKPIs(state.period);
  const prevKpis = computeKPIs(prevPeriod);
  const curVal = bucket === 'total' ? curKpis.total : bucket === 'criticalrisk' ? criticalRiskCount(state.period) : curKpis.buckets[bucket];
  const prevVal = bucket === 'total' ? prevKpis.total : bucket === 'criticalrisk' ? criticalRiskCount(prevPeriod) : prevKpis.buckets[bucket];
  return { delta: curVal - prevVal, prevVal, curVal, prevLabel: periodLabel(prevPeriod) };
}
function criticalRiskCount(period) {
  return CLIENT_MASTER.filter(c => inUserScope(c)).filter(c => computeClientRisk(c.code, period, INSTANCES, DEMANDS, NOTICES).level === 'Critical').length;
}
function monthlyTrend() {
  const months = [];
  for (let d = -4; d <= 0; d++) {
    const p = shiftPeriod(CURRENT_PERIOD, d);
    const rows = applyScopeFilters(instancesForPeriod(p));
    const filed = rows.filter(i => deriveOverallStatus(i).key === 'filed').length;
    const overdue = rows.filter(i => deriveOverallStatus(i).key === 'overdue').length;
    months.push({ label: MONTH_NAMES[p.m - 1], total: rows.length, filed, overdue, period: p });
  }
  return months;
}
function categoryBreakdown(period) {
  const rows = applyScopeFilters(instancesForPeriod(period));
  const map = {};
  rows.forEach(i => {
    const cat = complianceById(i.complianceId).category;
    map[cat] = map[cat] || { count:0, filed:0 };
    map[cat].count++;
    if (deriveOverallStatus(i).key === 'filed') map[cat].filed++;
  });
  return Object.entries(map).map(([label, v]) => ({ label, count: v.count, filed: v.filed, pct: v.count ? Math.round(v.filed / v.count * 100) : 0 })).sort((a, b) => b.count - a.count);
}
function riskDistribution(period) {
  const counts = { Critical:0, High:0, Medium:0, Low:0 };
  CLIENT_MASTER.filter(c => inUserScope(c)).forEach(c => { counts[computeClientRisk(c.code, period, INSTANCES, DEMANDS, NOTICES).level]++; });
  return counts;
}
function dueDateTimeline(period) {
  const rows = applyScopeFilters(instancesForPeriod(period));
  let overdue = 0, today = 0, next3 = 0, next7 = 0;
  rows.forEach(i => {
    const s = deriveOverallStatus(i);
    if (s.key === 'filed' || s.key === 'na') return;
    const d = diffDays(new Date(i.dueDate), TODAY);
    if (d < 0) overdue++; else if (d === 0) today++; else if (d <= 3) next3++; else if (d <= 7) next7++;
  });
  return { overdue, today, next3, next7 };
}
function teamWorkload(period) {
  const rows = applyScopeFilters(instancesForPeriod(period));
  const map = {};
  rows.forEach(i => {
    map[i.spoc] = map[i.spoc] || { total:0, filed:0, overdue:0, datapending:0 };
    map[i.spoc].total++;
    const k = deriveOverallStatus(i).key;
    if (k === 'filed') map[i.spoc].filed++;
    if (k === 'overdue') map[i.spoc].overdue++;
    if (k === 'datapending') map[i.spoc].datapending++;
  });
  const followupsDue = {};
  INSTANCES.filter(i => periodKey(i.period) === periodKey(period) && i.nextActionDate).forEach(i => { followupsDue[i.spoc] = (followupsDue[i.spoc] || 0) + 1; });
  return Object.entries(map).map(([spoc, v]) => ({ spoc, ...v, followupsDue: followupsDue[spoc] || 0 }));
}
function clientHealthTable(period) {
  return CLIENT_MASTER.filter(c => inUserScope(c)).map(c => {
    const insts = instancesForPeriod(period).filter(i => i.clientCode === c.code);
    const filed = insts.filter(i => deriveOverallStatus(i).key === 'filed').length;
    const overdue = insts.filter(i => deriveOverallStatus(i).key === 'overdue').length;
    const risk = computeClientRisk(c.code, period, INSTANCES, DEMANDS, NOTICES);
    return { client: c, total: insts.length, filed, overdue, risk };
  }).sort((a, b) => b.risk.score - a.risk.score);
}
function clientsRequiringAttention(period) {
  return clientHealthTable(period).filter(row => row.risk.level === 'Critical' || row.risk.level === 'High').map(row => {
    const insts = instancesForPeriod(period).filter(i => i.clientCode === row.client.code);
    const dataPending = insts.filter(i => deriveOverallStatus(i).key === 'datapending').length;
    return { ...row, dataPending, openCount: row.total - row.filed };
  });
}
function followUpSummary(period) {
  const rows = applyScopeFilters(instancesForPeriod(period));
  let dueToday = 0, overdue = 0, dueWeek = 0, noNextAction = 0;
  rows.forEach(i => {
    const s = deriveOverallStatus(i);
    if (s.key === 'filed' || s.key === 'na') return;
    if (!i.nextActionDate) { noNextAction++; return; }
    const d = diffDays(new Date(i.nextActionDate), TODAY);
    if (d < 0) overdue++; else if (d === 0) dueToday++; else if (d <= 7) dueWeek++;
  });
  return { dueToday, overdue, dueWeek, noNextAction };
}

/* ---------- MULTI-CHANNEL FOLLOW-UP (Email / SMS / WhatsApp) ----------
   These build real mailto:/sms:/wa.me links pre-filled with the message —
   clicking one opens the person's own email/SMS/WhatsApp app with a draft
   ready to review and send. Nothing is transmitted automatically; the
   person always sends it themselves from their own app. */
const IS_IOS = typeof navigator !== 'undefined' && /iPad|iPhone|iPod/.test(navigator.userAgent || '');

function buildFollowUpMessage(client, compliance, instance) {
  const subject = `${compliance ? compliance.name + ' — ' : ''}${client.name} — Action Needed`;
  const dueLine = instance ? `Due date: ${fmtDate(instance.dueDate)}.` : '';
  const actionLine = (instance && instance.nextAction) ? ` ${instance.nextAction}.` : '';
  const body = `Dear ${client.name},\n\n` +
    `This is a follow-up regarding ${compliance ? compliance.name : 'your pending compliance item'} for ${instance ? periodLabel(instance.period) : ''}. ${dueLine}${actionLine}\n\n` +
    `Please share the required information at your earliest convenience so we can proceed with the filing.\n\n` +
    `Regards,\n${client.spoc}`;
  return { subject, body };
}
function mailtoLink(client, subject, body) {
  return `mailto:${encodeURIComponent(client.email || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function smsLink(client, body) {
  const sep = IS_IOS ? '&' : '?';
  const digits = (client.phone || '').replace(/[^\d+]/g, '');
  return `sms:${digits}${sep}body=${encodeURIComponent(body)}`;
}
function whatsappLink(client, body) {
  const digits = (client.phone || '').replace(/\D/g, ''); // wa.me wants digits only, no plus
  return `https://wa.me/${digits}?text=${encodeURIComponent(body)}`;
}
function followUpLinksHtml(client, compliance, instance) {
  const { subject, body } = buildFollowUpMessage(client, compliance, instance);
  const hasEmail = !!client.email, hasPhone = !!client.phone;
  return `
    <a class="btn btn-sm ${hasEmail ? '' : 'disabled-link'}" ${hasEmail ? `href="${mailtoLink(client, subject, body)}"` : 'aria-disabled="true"'} title="${hasEmail ? client.email : 'No email on file'}">Email</a>
    <a class="btn btn-sm ${hasPhone ? '' : 'disabled-link'}" ${hasPhone ? `href="${smsLink(client, body)}"` : 'aria-disabled="true"'} title="${hasPhone ? client.phone : 'No phone on file'}">SMS</a>
    <a class="btn btn-sm ${hasPhone ? '' : 'disabled-link'}" ${hasPhone ? `href="${whatsappLink(client, body)}" target="_blank" rel="noopener"` : 'aria-disabled="true"'} title="${hasPhone ? client.phone : 'No phone on file'}">WhatsApp</a>
  `;
}

/* ---------- NOTIFICATIONS (browser Notification API + optional real push) ----------
   Two modes, and the app is honest about which one it's in:
   - No push server configured (state.pushServerUrl empty): notifications
     are LOCAL ONLY — they fire from data already on this page, on this
     device, same as always.
   - A push server IS configured (Admin sets it in Settings > Notifications):
     this device registers a real Web Push subscription with that server,
     and the Admin's broadcast button actually reaches every registered
     device via that server — this is the real multi-device path. */
let notificationsEnabled = false;
let cachedVapidPublicKey = null;

const NOTIFICATION_POLICY = {
  enabled: true,           // master switch
  dueDateReminders: true,  // morning digest: due today + overdue
  redFlagAlerts: true,     // alert when a client newly becomes Critical risk
};

// Standard helper for converting a VAPID public key (base64url string) into
// the Uint8Array format the Push API requires — there's no built-in browser
// function for this, every Web Push integration needs this exact snippet.
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function fetchVapidPublicKey() {
  if (!state.pushServerUrl) return null;
  if (cachedVapidPublicKey) return cachedVapidPublicKey;
  try {
    const res = await fetch(state.pushServerUrl.replace(/\/$/, '') + '/api/vapid-public-key');
    const data = await res.json();
    cachedVapidPublicKey = data.publicKey || null;
    return cachedVapidPublicKey;
  } catch (e) { return null; }
}

// Registers this device with the configured push server so the Admin's
// broadcast can actually reach it. No-ops quietly if no server is
// configured — that's the local-only mode, not an error.
async function subscribeToPushServer() {
  if (!state.pushServerUrl || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const publicKey = await fetchVapidPublicKey();
    if (!publicKey) { toast('Could not reach the push server — check the URL in Settings'); return; }
    const registration = await navigator.serviceWorker.ready;
    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }
    await fetch(state.pushServerUrl.replace(/\/$/, '') + '/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription, userId: state.currentUser.id, userName: state.currentUser.name }),
    });
    toast('This device is registered for push notifications');
  } catch (e) {
    toast('Push registration failed — notifications will stay local-only on this device');
  }
}

function enableNotifications() {
  if (!NOTIFICATION_POLICY.enabled) { toast('Notifications are disabled firm-wide by your Administrator'); return; }
  if (!('Notification' in window)) { toast('Notifications are not supported in this browser'); return; }
  if (Notification.permission === 'granted') {
    notificationsEnabled = true;
    fireSummaryNotification();
    if (state.pushServerUrl) subscribeToPushServer();
    return;
  }
  if (Notification.permission === 'denied') { toast('Notifications are blocked — enable them in your browser or device settings'); return; }
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') {
      notificationsEnabled = true;
      fireSummaryNotification();
      toast('Notifications enabled');
      if (state.pushServerUrl) subscribeToPushServer();
    } else toast('Notification permission not granted');
  });
}
function fireSummaryNotification() {
  const counts = todaysActionCounts(CURRENT_PERIOD);
  const parts = [];
  if (counts.overdue) parts.push(`${counts.overdue} overdue`);
  if (counts.dueToday) parts.push(`${counts.dueToday} due today`);
  if (counts.due3) parts.push(`${counts.due3} due in 3 days`);
  if (counts.followupsToday) parts.push(`${counts.followupsToday} follow-ups due`);
  const body = parts.length ? parts.join(' · ') : 'All caught up — nothing urgent today.';
  try {
    const n = new Notification('JACPOT', { body, tag: 'cc-summary' });
    n.onclick = () => { window.focus(); state.activeTab = 'dashboard'; renderApp(); n.close(); };
  } catch (e) { /* some embedded/prototype contexts block Notification construction even when permitted */ }
}

// "On the morning of each due date" — in a static front-end this means "the
// first time the app is opened in a session", not a true wake-while-closed
// alarm (that needs Push API + a server, see the Settings > Notifications
// note). Fires once per login so it doesn't repeat every time you switch tabs.
let dueDateDigestFiredThisSession = false;
function fireDueDateDigest() {
  if (!NOTIFICATION_POLICY.enabled || !NOTIFICATION_POLICY.dueDateReminders || !notificationsEnabled) return;
  if (dueDateDigestFiredThisSession) return;
  dueDateDigestFiredThisSession = true;
  const counts = todaysActionCounts(CURRENT_PERIOD);
  if (!counts.dueToday && !counts.overdue) return;
  const parts = [];
  if (counts.overdue) parts.push(`${counts.overdue} pending return${counts.overdue === 1 ? '' : 's'} overdue`);
  if (counts.dueToday) parts.push(`${counts.dueToday} due today`);
  try {
    const n = new Notification('Good morning — Compliance Due Today', { body: parts.join(' · '), tag:'cc-duedate' });
    n.onclick = () => { window.focus(); state.activeTab = 'dashboard'; renderApp(); n.close(); };
  } catch (e) {}
}

// "Any triggered red flag" — fires only for clients that newly became
// Critical since the last check, not every Critical client every time
// (that would just repeat itself on every status change). The first call
// each session establishes the baseline silently so pre-existing Critical
// clients don't all "alert" the moment you log in.
let redFlagKnownCritical = new Set();
let redFlagBaselineEstablished = false;
function checkRedFlags() {
  if (!NOTIFICATION_POLICY.enabled || !NOTIFICATION_POLICY.redFlagAlerts) return;
  const currentCritical = new Set(CLIENT_MASTER.filter(c => computeClientRisk(c.code, state.period, INSTANCES, DEMANDS, NOTICES).level === 'Critical').map(c => c.code));
  if (!redFlagBaselineEstablished) {
    redFlagKnownCritical = currentCritical;
    redFlagBaselineEstablished = true;
    return;
  }
  if (notificationsEnabled) {
    const newlyCritical = [...currentCritical].filter(code => !redFlagKnownCritical.has(code));
    if (newlyCritical.length) {
      const names = newlyCritical.map(code => clientByCode(code).name).slice(0, 3).join(', ');
      try {
        const n = new Notification('🔴 Red Flag — Critical Risk', { body: `${names}${newlyCritical.length > 3 ? ` +${newlyCritical.length - 3} more` : ''} now at Critical risk`, tag: 'cc-redflag-' + Date.now() });
        n.onclick = () => { window.focus(); state.activeTab = 'dashboard'; state.dashboardView = 'risk'; renderApp(); n.close(); };
      } catch (e) {}
    }
  }
  redFlagKnownCritical = currentCritical;
}
function toggleNotificationPolicy(key) {
  NOTIFICATION_POLICY[key] = !NOTIFICATION_POLICY[key];
  toast(`${key === 'enabled' ? 'Notifications' : key === 'dueDateReminders' ? 'Due-date reminders' : 'Red-flag alerts'} ${NOTIFICATION_POLICY[key] ? 'enabled' : 'disabled'} firm-wide`);
}
// Admin's "send to all devices" — genuinely reaches every registered device
// when a push server is configured (calls its /api/broadcast). Falls back
// to a clearly-labeled local-only notification when it isn't, rather than
// silently pretending either way.
async function broadcastTestNotification() {
  if (state.pushServerUrl) {
    try {
      const res = await fetch(state.pushServerUrl.replace(/\/$/, '') + '/api/broadcast', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': state.pushAdminKey || '' },
        body: JSON.stringify({ title: 'JACPOT — Test Broadcast', body: `Sent by ${state.currentUser.name} to every registered device`, url: '/' }),
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Broadcast failed — check the admin key in Settings'); return; }
      toast(`Broadcast sent to ${data.sent} device${data.sent === 1 ? '' : 's'}${data.removed ? ` (${data.removed} expired, removed)` : ''}`);
    } catch (e) {
      toast('Could not reach the push server — check the URL in Settings');
    }
    return;
  }
  if (!('Notification' in window)) { toast('Notifications are not supported in this browser'); return; }
  if (Notification.permission !== 'granted') { toast('Enable notifications on this device first'); return; }
  try {
    const n = new Notification('JACPOT — Test Broadcast', { body: `Sent by ${state.currentUser.name} · This device only — no push server configured yet`, tag:'cc-broadcast' });
    n.onclick = () => { window.focus(); n.close(); };
    toast('Test notification sent — this device only (no push server configured)');
  } catch (e) { toast('Could not send notification'); }
}
async function savePushServerConfig(url, adminKey) {
  state.pushServerUrl = (url || '').trim();
  state.pushAdminKey = (adminKey || '').trim();
  cachedVapidPublicKey = null;
  if (!state.pushServerUrl) { toast('Push server cleared — notifications are local-only again'); return; }
  try {
    const res = await fetch(state.pushServerUrl.replace(/\/$/, '') + '/api/status');
    const data = await res.json();
    if (data.ok) toast(`Connected — ${data.deviceCount} device${data.deviceCount === 1 ? '' : 's'} currently registered`);
    else toast('Push server responded, but something looks off — check the URL');
  } catch (e) {
    toast('Could not reach that push server — double check the URL and that it\'s running');
  }
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 2600);

/* ---------- SVG CHART BUILDERS (hand-rolled, no external chart lib — uses
   CSS variables for color so every chart adapts to dark mode automatically,
   same as the rest of the app; native <title> tags give free hover tooltips) ---------- */
function donutChart(segments, size) {
  size = size || 168;
  const thickness = Math.round(size * 0.14);
  const total = segments.reduce((s, x) => s + x.value, 0);
  const r = (size - thickness) / 2;
  const circumference = 2 * Math.PI * r;
  const cx = size / 2, cy = size / 2;
  if (!total) {
    return `<svg class="chart-donut-wrap" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${thickness}"/><text x="${cx}" y="${cy + 6}" text-anchor="middle" font-family="var(--font-mono)" font-size="20" font-weight="700" fill="var(--ink-faint)">0</text></svg>`;
  }
  let offset = 0;
  const paths = segments.filter(s => s.value > 0).map(seg => {
    const frac = seg.value / total;
    const dash = frac * circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-dasharray="${dash.toFixed(2)} ${(circumference - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" class="donut-seg" data-action="kpiClick" data-bucket="${seg.key}"><title>${seg.label}: ${seg.value}</title></circle>`;
    offset += dash;
    return el;
  }).join('');
  return `<svg class="chart-donut-wrap" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<text x="${cx}" y="${cy - 3}" text-anchor="middle" font-family="var(--font-mono)" font-size="22" font-weight="700" fill="var(--ink)">${total}</text><text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="9" fill="var(--ink-soft)">TOTAL</text></svg>`;
}
function monthlyTrendChartSvg(months) {
  const w = 560, h = 180, padBottom = 26, padTop = 16, padLeft = 8, padRight = 8;
  const maxVal = Math.max(...months.map(m => m.total), 1);
  const plotW = w - padLeft - padRight;
  const barW = Math.min(56, plotW / months.length - 16);
  const gap = (plotW - barW * months.length) / (months.length + 1);
  const yBase = h - padBottom;
  const scaleY = (h - padBottom - padTop) / maxVal;
  const bars = months.map((m, i) => {
    const x = padLeft + gap + i * (barW + gap);
    const totalH = m.total * scaleY, filedH = m.filed * scaleY, overdueH = m.overdue * scaleY;
    const isCurrent = periodKey(m.period) === periodKey(CURRENT_PERIOD);
    const delay = (i * 0.06).toFixed(2);
    return `<rect class="chart-bar-y" style="animation-delay:${delay}s" x="${x.toFixed(1)}" y="${(yBase - totalH).toFixed(1)}" width="${barW}" height="${totalH.toFixed(1)}" fill="var(--border-soft)" rx="3"/>
      <rect class="chart-bar-y" style="animation-delay:${delay}s" x="${x.toFixed(1)}" y="${(yBase - filedH).toFixed(1)}" width="${barW}" height="${filedH.toFixed(1)}" fill="var(--green)" rx="3" opacity="0.85"/>
      <rect class="chart-bar-y" style="animation-delay:${delay}s" x="${(x + barW - 9).toFixed(1)}" y="${(yBase - overdueH).toFixed(1)}" width="9" height="${overdueH.toFixed(1)}" fill="var(--red)" rx="2"/>
      <text x="${(x + barW / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10.5" font-weight="${isCurrent ? 700 : 500}" fill="${isCurrent ? 'var(--ink)' : 'var(--ink-soft)'}">${m.label}</text>
      <title>${m.label}: ${m.total} total, ${m.filed} filed, ${m.overdue} overdue</title>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}
function categoryBarChartSvg(cats) {
  const w = 500, rowH = 27, padLeft = 112, padRight = 46;
  const h = Math.max(cats.length, 1) * rowH + 8;
  const maxCount = Math.max(...cats.map(c => c.count), 1);
  const plotW = w - padLeft - padRight;
  if (!cats.length) return `<div style="color:var(--ink-faint); font-size:12px; padding:10px 0;">No applicable compliances this period.</div>`;
  const bars = cats.map((c, i) => {
    const y = i * rowH + 4;
    const barW = (c.count / maxCount) * plotW;
    const delay = (i * 0.05).toFixed(2);
    return `<text x="${padLeft - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="11" fill="var(--ink-soft)">${c.label}</text>
      <rect x="${padLeft}" y="${y + 3}" width="${plotW}" height="${rowH - 11}" fill="var(--border-soft)" rx="4"/>
      <rect class="chart-bar-x" style="animation-delay:${delay}s" x="${padLeft}" y="${y + 3}" width="${barW.toFixed(1)}" height="${rowH - 11}" fill="var(--indigo)" rx="4"/>

function kpiCardHtml(def, num) {
  const trend = kpiTrend(def.bucket);
  let trendHtml = '';
  if (trend) {
    const arrow = trend.delta > 0 ? '↑' : trend.delta < 0 ? '↓' : '→';
    let color = 'var(--ink-faint)';
    if (def.judge === 'up-good') color = trend.delta > 0 ? 'var(--green)' : trend.delta < 0 ? 'var(--red)' : 'var(--ink-faint)';
    if (def.judge === 'up-bad') color = trend.delta > 0 ? 'var(--red)' : trend.delta < 0 ? 'var(--green)' : 'var(--ink-faint)';
    trendHtml = `<div class="kpi-trend" style="color:${color};">${arrow} ${Math.abs(trend.delta)} vs ${trend.prevLabel}</div>`;
  }
  const alertClass = def.key === 'criticalrisk' && num > 0 ? ' has-alert' : '';
  return `<div class="card kpi-card ${def.key}${alertClass}" data-action="kpiClick" data-bucket="${def.bucket === 'total' ? '' : def.bucket}"><div class="kpi-num" data-target="${num}">${num}</div><div class="kpi-label">${def.label}</div><div class="kpi-desc">${def.desc}</div>${trendHtml}</div>`;
}
function prefersReducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
// Counts each KPI number up from 0 on render — skipped entirely (numbers
// just show their final value) if the user has reduced motion set.
function animateKpiNumbers() {
  if (prefersReducedMotion()) return;
  document.querySelectorAll('#page-dashboard .kpi-num[data-target]').forEach(el => {
    const target = parseInt(el.dataset.target, 10);
    if (isNaN(target)) return;
    const duration = 550;
    const startTime = performance.now();
    function tick(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(target * eased);
      if (progress < 1) requestAnimationFrame(tick);
      else el.textContent = target;
    }
    requestAnimationFrame(tick);
  });
}

// Single click = quick status popover; double click = add note. Uses a short
// delay on click so a genuine double-click can cancel the single-click
// action before it fires, rather than opening both.
function wireTrackerCellEvents() {
  document.querySelectorAll('#page-compliance td.cell[data-instance]').forEach(td => {
    let timer = null;
    let longPressTimer = null, longPressFired = false;
    td.addEventListener('click', () => {
      if (timer) return;
      timer = setTimeout(() => { timer = null; openStatusPopover(td.dataset.instance); }, 260);
    });
    td.addEventListener('dblclick', () => {
      if (timer) { clearTimeout(timer); timer = null; }
      openNoteModal(td.dataset.instance);
    });
    td.addEventListener('keydown', e => { if (e.key === 'Enter') openStatusPopover(td.dataset.instance); });
    // Long-press (touch) = jump straight to the full drawer, the touch
    // equivalent of the desktop "View Full Details" link inside the popover.
    td.addEventListener('touchstart', () => {
      longPressFired = false;
      longPressTimer = setTimeout(() => {
        longPressFired = true;
        if (timer) { clearTimeout(timer); timer = null; }
        if (navigator.vibrate) navigator.vibrate(12);
        openDrawer(td.dataset.instance);
      }, 550);
    }, { passive:true });
    td.addEventListener('touchmove', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } }, { passive:true });
    td.addEventListener('touchend', e => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      if (longPressFired) e.preventDefault(); // suppress the synthetic click a long-press would otherwise still fire
    }, { passive:false });
  });
}
// Shared swipe-detection helper — used for month navigation and
// swipe-to-dismiss. Calls onSwipe('left'|'right'|'up'|'down') only once a
// real, mostly-single-axis drag clears the threshold; taps and scrolls
// inside the element are left completely alone.
function attachSwipe(el, onSwipe, threshold) {
  if (!el) return;
  threshold = threshold || 60;
  let sx = 0, sy = 0, tracking = false;
  el.addEventListener('touchstart', e => { if (e.touches.length !== 1) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true; }, { passive:true });
  el.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const dx = (e.changedTouches[0].clientX - sx), dy = (e.changedTouches[0].clientY - sy);
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > threshold) onSwipe(dx > 0 ? 'right' : 'left');
    else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > threshold) onSwipe(dy > 0 ? 'down' : 'up');
  }, { passive:true });
}
// Swipe-down-to-dismiss on the drawer and every modal — wired once at
// startup since these are static shell elements (only their body content is
// replaced per render), scoped to each header so it never fights with
// scrolling through a long form underneath.
function wireSwipeDismiss() {
  attachSwipe(document.querySelector('.drawer-head'), dir => { if (dir === 'down') closeDrawer(); }, 60);
  document.querySelectorAll('.modal-head').forEach(head => {
    attachSwipe(head, dir => {
      if (dir !== 'down') return;
      const overlay = head.closest('.modal-overlay');
      if (!overlay) return;
      if (overlay.id === 'statusPopoverOverlay') { closeStatusPopover(); renderCompliance(); }
      else if (overlay.id === 'noteModalOverlay') closeNoteModal();
      else if (overlay.id === 'clientFormOverlay') closeClientForm();
      else if (overlay.id === 'exportOverlay') { state.exportDialogOpen = false; renderExportDialog(); }
      else if (overlay.id === 'reraImportOverlay') { state.reraImportOpen = false; renderReraImportModal(); }
    }, 60);
  });
}

function closeDrawer() { document.getElementById('drawerOverlay').classList.remove('open'); state.drawerInstanceId = null; }
function renderDrawer(instanceId) {
  const inst = INSTANCES.find(i => i.id === instanceId);
  if (!inst) return;
  const client = clientByCode(inst.clientCode);
  const compliance = complianceById(inst.complianceId);

  const dueFlag = daysUntil < 0 ? `<span style="color:var(--red); font-weight:600;">${Math.abs(daysUntil)} day${Math.abs(daysUntil) === 1 ? '' : 's'} overdue</span>` : daysUntil === 0 ? `<span style="color:var(--amber); font-weight:600;">Due today</span>` : `<span style="color:var(--ink-soft);">Due in ${daysUntil} day${daysUntil === 1 ? '' : 's'}</span>`;

      <div class="assign-row"><span>Assigned</span><b>${inst.spoc}</b></div>
      <div class="assign-row"><span>Partner</span><b>${inst.partner}</b></div>
      <div class="assign-row"><span>Manager</span><b>${inst.manager}</b></div>

    </div>
    <div class="drawer-section"><div class="drawer-section-title">Status</div><div class="field-row three">
      <div class="field"><label>Data Status</label><select id="d-data">${DATA_STATUS_OPTIONS.map(o => `<option ${inst.dataStatus === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>

      <div class="field"><label>Filing Date</label><input type="date" id="d-filingdate" value="${inst.filingDate || ''}"></div>
      <div class="field"><label>Ack / Reference No.</label><input type="text" id="d-ackno" value="${inst.ackNo || ''}"></div>
    </div></div>
    <div class="drawer-section"><div class="drawer-section-title">Next Action</div><div class="field-row">
      <div class="field"><label>Next Action</label><input type="text" id="d-nextaction" value="${inst.nextAction || ''}" placeholder="What needs to happen next?"></div>

      <p style="font-size:11px; color:var(--ink-soft); margin:0 0 8px;">Opens your own email / SMS / WhatsApp app with a message pre-filled — nothing is sent automatically.</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">${followUpLinksHtml(client, compliance, inst)}</div>
    </div>

      <div class="log-list">${logHtml}</div>

function closeStatusPopover() {

function statusPillGroup(label, options, current, dimension) {
  return `<div class="qs-group">
    <div class="qs-group-label">${label}</div>
    <div class="qs-pills">${options.map(o => `<button class="qs-pill ${o === current ? 'active' : ''}" data-action="quickSetStatus" data-dim="${dimension}" data-value="${o}">${o}</button>`).join('')}</div>
  </div>`;
}
function renderStatusPopover() {
  const inst = INSTANCES.find(i => i.id === state.statusPopoverInstanceId);
  if (!inst) return;
  const client = clientByCode(inst.clientCode);
  const compliance = complianceById(inst.complianceId);
  document.getElementById('statusPopoverTitle').textContent = `${client.name} — ${compliance.name}`;
  document.getElementById('statusPopoverBody').innerHTML =
    statusPillGroup('Data Status', DATA_STATUS_OPTIONS, inst.dataStatus, 'data') +
    statusPillGroup('Working Status', WORKING_STATUS_OPTIONS, inst.workingStatus, 'working') +
    statusPillGroup('Filing Status', FILING_STATUS_OPTIONS, inst.filingStatus, 'filing');
}
function quickSetStatus(dim, value) {
  const inst = INSTANCES.find(i => i.id === state.statusPopoverInstanceId);
  if (!inst) return;
  const fieldMap = { data:'dataStatus', working:'workingStatus', filing:'filingStatus' };
  const labelMap = { data:'Data Status', working:'Working Status', filing:'Filing Status' };
  inst[fieldMap[dim]] = value;
  if (dim === 'filing' && value === 'Filed' && !inst.filingDate) inst.filingDate = isoDate(TODAY);
  toast(`${labelMap[dim]} updated`);
  renderStatusPopover();
  renderCompliance();
  renderDashboard();
  renderHeader();
  checkRedFlags();
}

function renderClient360Tab(client, risk) {
  const el = document.getElementById('c360-content');
  if (!el) return;
  const tab = state.clientDetailTab;
  const clientInstances = instancesForPeriod(state.period).filter(i => i.clientCode === client.code);

  if (tab === 'overview') {
    const catGroups = {};
    clientInstances.forEach(i => {
      const comp = complianceById(i.complianceId);
      catGroups[comp.category] = catGroups[comp.category] || { filed:0, total:0 };
      catGroups[comp.category].total++;
      if (deriveOverallStatus(i).key === 'filed') catGroups[comp.category].filed++;
    });
    const catHtml = Object.entries(catGroups).map(([cat, v]) => `<div class="cat-progress"><span>${cat}</span><span class="mono">${v.filed} / ${v.total} Filed</span></div>`).join('') || '<p style="color:var(--ink-faint); font-size:12px;">No applicable compliances this period.</p>';
    const dataPending = clientInstances.filter(i => deriveOverallStatus(i).key === 'datapending').length;
    const overdue = clientInstances.filter(i => deriveOverallStatus(i).key === 'overdue').length;
    const followupDue = clientInstances.filter(i => i.nextActionDate && i.nextActionDate <= isoDate(TODAY)).length;
    const recentLogs = [];
    clientInstances.forEach(i => (i.communicationLogs || []).forEach(l => recentLogs.push({ ...l, compliance: complianceById(i.complianceId).name })));
    recentLogs.sort((a, b) => b.date.localeCompare(a.date));
    el.innerHTML = `<div class="overview-grid">
      <div class="card" style="padding:16px;"><h3 style="font-size:12.5px; margin-bottom:8px;">Current Period — ${periodLabel(state.period)}</h3>${catHtml}</div>
      <div class="card" style="padding:16px;"><h3 style="font-size:12.5px; margin-bottom:10px;">Open Issues</h3><div>
        ${dataPending ? `<span class="issue-pill">📥 ${dataPending} Data Pending</span>` : ''}${overdue ? `<span class="issue-pill">🔴 ${overdue} Overdue</span>` : ''}${followupDue ? `<span class="issue-pill">👤 ${followupDue} Follow-up Due</span>` : ''}
        ${!dataPending && !overdue && !followupDue ? `<span style="color:var(--ink-faint); font-size:12px;">No open issues this period.</span>` : ''}
      </div><h3 style="font-size:12.5px; margin:14px 0 8px;">Recent Activity</h3>
        ${recentLogs.slice(0, 4).map(l => `<div style="font-size:11.5px; padding:5px 0; border-bottom:1px solid var(--border-soft);"><b>${l.compliance}</b> — ${l.subject} <span style="color:var(--ink-faint);">(${fmtDate(l.date)})</span></div>`).join('') || '<p style="color:var(--ink-faint); font-size:12px;">No recent activity.</p>'}
      </div></div>`;
  } else if (tab === 'compliances') {
    const periods = [-1, 0, 1].map(d => shiftPeriod(CURRENT_PERIOD, d));
    const historyHtml = periods.map(p => `<div class="history-item ${periodKey(p) === periodKey(state.period) ? 'active' : ''}" data-action="setPeriodDirect" data-y="${p.y}" data-m="${p.m}">${periodLabel(p)}${periodKey(p) === periodKey(CURRENT_PERIOD) ? ' (current)' : ''}</div>`).join('');
    const rows = clientInstances.map(i => { const comp = complianceById(i.complianceId); const s = deriveOverallStatus(i); return `<tr class="clickable" data-action="openDrawer" data-instance="${i.id}"><td>${comp.name}</td><td class="mono" style="font-size:11.5px;">${fmtDate(i.dueDate)}</td><td><span class="dim-pill">${i.dataStatus}</span></td><td><span class="dim-pill">${i.workingStatus}</span></td><td>${statusBadge(s)}</td><td class="row-chevron">›</td></tr>`; }).join('') || `<tr><td colspan="6" style="text-align:center; color:var(--ink-faint); padding:20px;">No applicable compliances for ${periodLabel(state.period)}.</td></tr>`;
    el.innerHTML = `<div class="overview-grid" style="grid-template-columns:200px 1fr;"><div class="card" style="padding:12px;"><h3 style="font-size:11.5px; margin-bottom:6px;">History</h3><div class="history-list">${historyHtml}</div></div><div class="card"><table><thead><tr><th>Compliance</th><th>Due Date</th><th>Data</th><th>Working</th><th>Filing</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  } else if (tab === 'followups') {
    const items = clientInstances.filter(i => i.nextActionDate);
    el.innerHTML = `<div class="card"><table><thead><tr><th>Compliance</th><th>Next Action</th><th>Date</th><th>SPOC</th></tr></thead><tbody>${items.map(i => `<tr><td>${complianceById(i.complianceId).name}</td><td>${i.nextAction || '—'}</td><td class="mono" style="font-size:11.5px;">${fmtDate(i.nextActionDate)}</td><td>${i.spoc}</td></tr>`).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--ink-faint); padding:20px;">No follow-ups scheduled.</td></tr>`}</tbody></table></div>`;
  } else if (tab === 'notices') {
    el.innerHTML = renderNoticesTable(NOTICES.filter(n => n.client === client.code));
  } else if (tab === 'demands') {
    el.innerHTML = renderDemandsTable(DEMANDS.filter(d => d.client === client.code));
  } else if (tab === 'refunds') {
    el.innerHTML = renderRefundsTable(REFUNDS.filter(r => r.client === client.code));
  } else if (tab === 'rera') {
    if (!client.rera) {
      el.innerHTML = `<div class="card empty-state"><h3>Not a RERA-registered client</h3><p>${client.name} has no active RERA projects.</p></div>`;
    } else {
      const projects = RERA_PROJECTS.filter(p => p.client === client.code);
      el.innerHTML = `<div class="card"><table><thead><tr><th>Project</th><th>Status</th><th>Note</th></tr></thead><tbody>${projects.map(p => `<tr><td style="font-weight:600;">${p.project}</td><td>${statusBadge(p.status === 'In Progress' ? { key:'inprogress', label:'In Progress' } : { key:'datapending', label:'Data Pending' })}</td><td style="font-size:11.5px; color:var(--ink-soft);">${p.note}</td></tr>`).join('')}</tbody></table></div>`;
    }
  }
}

/* ---------- SHARED TABLES (Demands / Refunds / Notices) ---------- */
function renderDemandsTable(items) {
  const rows = items.map(d => { const cl = clientByCode(d.client); return `<tr><td>${cl.name}</td><td>${d.head}</td><td class="mono">${fmtINR(d.amount)}</td><td class="mono" style="font-size:11.5px;">${fmtDate(d.dateRaised)}</td><td>${d.status === 'Outstanding' ? '<span class="badge overdue"><span class="dot"></span>Outstanding</span>' : '<span class="badge filed"><span class="dot"></span>Resolved</span>'}</td><td style="font-size:11px; color:var(--ink-soft);">${d.status === 'Outstanding' ? 'Response due ' + fmtDate(d.responseDue) : 'Resolved ' + fmtDate(d.resolvedDate)}<br>${d.notes}</td></tr>`; }).join('') || `<tr><td colspan="6" style="text-align:center; color:var(--ink-faint); padding:20px;">No demands on record.</td></tr>`;
  return `<div class="card"><table><thead><tr><th>Client</th><th>Head</th><th>Amount</th><th>Raised</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderRefundsTable(items) {
  const rows = items.map(r => { const cl = clientByCode(r.client); return `<tr><td>${cl.name}</td><td>${r.head}</td><td class="mono">${fmtINR(r.amount)}</td><td class="mono" style="font-size:11.5px;">${fmtDate(r.dateClaimed)}</td><td>${r.status === 'Credited' ? '<span class="badge filed"><span class="dot"></span>Credited</span>' : '<span class="badge inprogress"><span class="dot"></span>Processing</span>'}</td><td style="font-size:11px; color:var(--ink-soft);">${r.status === 'Credited' ? 'Credited ' + fmtDate(r.creditedDate) : r.notes}</td></tr>`; }).join('') || `<tr><td colspan="6" style="text-align:center; color:var(--ink-faint); padding:20px;">No refunds on record.</td></tr>`;
  return `<div class="card"><table><thead><tr><th>Client</th><th>Head</th><th>Amount</th><th>Claimed</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderNoticesTable(items) {
  const rows = items.map(n => { const cl = clientByCode(n.client); return `<tr><td>${cl.name}</td><td>${n.type}</td><td class="mono" style="font-size:11px;">${n.ref}</td><td>${n.subject}</td><td class="mono" style="font-size:11.5px;">${fmtDate(n.dateReceived)}</td><td>${n.status === 'Open' ? '<span class="badge actionreq"><span class="dot"></span>Open</span>' : '<span class="badge filed"><span class="dot"></span>Responded</span>'}</td><td style="font-size:11px; color:var(--ink-soft);">${n.status === 'Open' ? 'Response due ' + fmtDate(n.responseDue) : n.notes}</td></tr>`; }).join('') || `<tr><td colspan="7" style="text-align:center; color:var(--ink-faint); padding:20px;">No notices on record.</td></tr>`;
  return `<div class="card"><table><thead><tr><th>Client</th><th>Type</th><th>Ref</th><th>Subject</th><th>Received</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- TAX MATTERS ---------- */
function renderTaxMatters() {
  const subtabs = [{ key:'demands', label:'Demands' }, { key:'refunds', label:'Refunds' }, { key:'notices', label:'Notices' }];
  const tabsHtml = subtabs.map(t => `<button class="c360-tab ${state.taxMattersSubtab === t.key ? 'active' : ''}" data-action="setTaxMattersTab" data-tab="${t.key}">${t.label}</button>`).join('');

}

/* ---------- FOLLOW-UPS ---------- */

  const items = [];

  items.sort((a, b) => a.instance.nextActionDate.localeCompare(b.instance.nextActionDate));
  const rows = items.map(it => `<tr>
      <td style="font-weight:600; cursor:pointer;" data-action="openDrawer" data-instance="${it.instance.id}">${it.client.name}</td>
      <td style="cursor:pointer;" data-action="openDrawer" data-instance="${it.instance.id}">${it.compliance.name} · ${periodLabel(it.instance.period)}</td>
      <td style="cursor:pointer;" data-action="openDrawer" data-instance="${it.instance.id}">${it.instance.nextAction || '—'}</td>
      <td class="mono" style="font-size:11.5px; cursor:pointer; ${it.instance.nextActionDate <= isoDate(TODAY) ? 'color:var(--red); font-weight:700;' : ''}" data-action="openDrawer" data-instance="${it.instance.id}">${fmtDate(it.instance.nextActionDate)}</td>
      <td style="font-size:11.5px;">${it.client.spoc}</td>
      <td><div style="display:flex; gap:5px;">${followUpLinksHtml(it.client, it.compliance, it.instance)}</div></td>
    </tr>`).join('') || emptyStateHtml('No follow-ups scheduled', 'Follow-up dates set from the compliance drawer will appear here, firm-wide.', 'noop');
  document.getElementById('page-followups').innerHTML = `
    <div class="section-head"><h2>Follow-ups</h2><span class="meta">${items.length} scheduled, firm-wide</span></div>
    <div class="card" style="padding:10px 16px; margin-bottom:12px; font-size:11.5px; color:var(--ink-soft);">Firm-wide follow-up register — every compliance instance with a Next Action Date set, across all clients and periods. Set or update these from the Compliance Tracker drawer; send a reminder directly via Email, SMS or WhatsApp from here.</div>
    <div class="card"><table><thead><tr><th>Client</th><th>Compliance</th><th>Next Action</th><th>Date</th><th>SPOC</th><th>Send</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- REPORTS ---------- */
function renderReports() {
  const cardsHtml = REPORT_DEFS.map(r => `<button class="card report-card" data-action="selectReport" data-report="${r.key}"><h4>${r.title}</h4><p>${r.desc}</p></button>`).join('');
  const body = state.selectedReport ? renderReportBody(state.selectedReport) : '';
  document.getElementById('page-reports').innerHTML = `<div class="section-head"><h2>Reports</h2><span class="meta">${periodLabel(state.period)}</span></div><div class="report-grid">${cardsHtml}</div>${body}`;
}
function reportTable(items, title) {
  const rows = items.map(i => { const cl = clientByCode(i.clientCode), comp = complianceById(i.complianceId); return `<tr class="clickable" data-action="openDrawer" data-instance="${i.id}"><td>${cl.name}</td><td>${comp.name}</td><td class="mono" style="font-size:11.5px;">${fmtDate(i.dueDate)}</td><td>${cl.spoc}</td></tr>`; }).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--ink-faint); padding:20px;">No records.</td></tr>`;
  return `<div class="card"><div style="padding:14px 16px 0;"><h3 style="font-size:13px;">${title}</h3></div><table style="margin-top:8px;"><thead><tr><th>Client</th><th>Compliance</th><th>Due Date</th><th>SPOC</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderReportBody(key) {
  const rows = applyScopeFilters(instancesForPeriod(state.period));
  if (key === 'register') { state.exportDialogOpen = true; renderExportDialog(); return ''; }
  if (key === 'summary') { const kpis = computeKPIs(state.period); return `<div class="card" style="padding:16px;"><h3 style="font-size:13px; margin-bottom:8px;">Management Summary</h3><p style="font-size:12.5px; line-height:1.7;">${managementSummaryText(kpis, computeHealthScore(kpis))}</p></div>`; }
  if (key === 'overdue') return reportTable(rows.filter(i => deriveOverallStatus(i).key === 'overdue'), 'Overdue Report');
  if (key === 'datapending') return reportTable(rows.filter(i => deriveOverallStatus(i).key === 'datapending'), 'Data Pending Report');
  if (key === 'spoc') {
    const groups = {};
    rows.forEach(i => { const sp = i.spoc; groups[sp] = groups[sp] || { total:0, filed:0, overdue:0 }; groups[sp].total++; const s = deriveOverallStatus(i); if (s.key === 'filed') groups[sp].filed++; if (s.key === 'overdue') groups[sp].overdue++; });
    return `<div class="card"><table><thead><tr><th>SPOC</th><th>Total</th><th>Filed</th><th>Overdue</th></tr></thead><tbody>${Object.entries(groups).map(([sp, g]) => `<tr><td style="font-weight:600;">${sp}</td><td class="mono">${g.total}</td><td class="mono">${g.filed}</td><td class="mono">${g.overdue}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if (key === 'client') {
    const groups = {};
    rows.forEach(i => { const c = i.clientCode; groups[c] = groups[c] || { total:0, filed:0, overdue:0 }; groups[c].total++; const s = deriveOverallStatus(i); if (s.key === 'filed') groups[c].filed++; if (s.key === 'overdue') groups[c].overdue++; });
    return `<div class="card"><table><thead><tr><th>Client</th><th>Total</th><th>Filed</th><th>Overdue</th></tr></thead><tbody>${Object.entries(groups).map(([code, g]) => `<tr><td style="font-weight:600;">${clientByCode(code).name}</td><td class="mono">${g.total}</td><td class="mono">${g.filed}</td><td class="mono">${g.overdue}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if (key === 'demand') return renderDemandsTable(DEMANDS.filter(d => matchesOffice(clientByCode(d.client))));
  return '';
}

/* ---------- MASTERS ---------- */
// "Clients" deliberately isn't here — it already has two clear entry points

function renderMastersBody() {

  if (s === 'compliance') {
    const canEditThis = canEdit('Masters');

      <div class="table-scroll"><table><thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Frequency</th><th>Due Date Rule</th><th>Status</th>${canEditThis ? '<th></th>' : ''}</tr></thead><tbody>

      </tbody></table></div></div>`;

    el.innerHTML = simpleMasterTable('partners', 'Partners');
  } else if (s === 'managers') {
    el.innerHTML = simpleMasterTable('managers', 'Managers');

  } else if (s === 'users') {

    el.innerHTML = `<div class="card"><div class="toolbar"><span style="font-weight:700; font-size:13px;">User Master</span></div>
      <table><thead><tr><th>User ID</th><th>Name</th><th>Role</th><th>Status</th><th>Access Level</th><th>Last Active</th><th></th></tr></thead><tbody>

          <td class="mono">${u.id}</td><td style="font-weight:600;">${u.name}</td>

          <td style="font-size:11.5px; color:var(--ink-soft);">${u.role === 'Admin' ? 'Full Access' : u.role === 'Executive' ? 'Operational + Masters' : 'Assigned Work'}</td>
          <td class="mono" style="font-size:11px; color:var(--ink-faint);">${state.currentUser && state.currentUser.id === u.id ? 'Just now' : '—'}</td>
          <td>${canEdit('Users') ? `<button class="btn btn-sm" data-action="toggleUserActive" data-id="${u.id}" ${u.id === state.currentUser.id ? 'disabled title="Cannot deactivate your own account"' : ''}>${u.active ? 'Deactivate' : 'Activate'}</button>` : '—'}</td>
        </tr>`).join('')}
      </tbody></table></div>`;
  } else if (s === 'permissions') {
    if (!canSeeMaster('permissions')) { el.innerHTML = adminOnlyNotice(); return; }

        ${PERMISSION_MATRIX.rows.map(row => `<tr><td style="font-weight:600;">${row}</td>${PERMISSION_MATRIX.cols.map(col => {

    <div><div class="drawer-section-title" style="margin-bottom:8px;">Format</div><div class="radio-row"><label class="radio-opt"><input type="radio" name="exp-format" value="excel" ${cfg.format === 'excel' ? 'checked' : ''}> Excel (.csv)</label><label class="radio-opt"><input type="radio" name="exp-format" value="pdf" ${cfg.format === 'pdf' ? 'checked' : ''}> PDF (print)</label></div></div>
    <div><div class="drawer-section-title" style="margin-bottom:8px;">Columns</div><div class="check-grid">${colDefs.map(([k, l]) => `<label class="check-opt"><input type="checkbox" data-col="${k}" ${cfg.columns[k] ? 'checked' : ''}> ${l}</label>`).join('')}</div></div>
  `;
}
function generateExport() {
  const format = document.querySelector('input[name="exp-format"]:checked').value;
  const periodMode = document.querySelector('input[name="exp-period"]:checked').value;
  const cols = {};
  document.querySelectorAll('#exportBody input[data-col]').forEach(cb => { cols[cb.dataset.col] = cb.checked; });

  let rows;
  if (periodMode === 'current') rows = applyScopeFilters(instancesForPeriod(state.period));
  else { const fy = fyOf(state.period); rows = INSTANCES.filter(i => fyOf(i.period).start === fy.start && matchesOffice(clientByCode(i.clientCode))); }

  if (format === 'pdf') {
    state.exportDialogOpen = false; renderExportDialog();
    toast('Opening print dialog for PDF export');
    setTimeout(() => window.print(), 300);
    return;
  }
  const colDefs = [['client', 'Client'], ['compliance', 'Compliance'], ['dueDate', 'Due Date'], ['dataStatus', 'Data Status'], ['workingStatus', 'Working Status'], ['filingStatus', 'Filing Status'], ['filingDate', 'Filing Date'], ['ackNo', 'Ack / Ref No.'], ['spoc', 'SPOC'], ['risk', 'Risk']];
  const activeCols = colDefs.filter(([k]) => cols[k]);
  const header = activeCols.map(([, l]) => l);
  const csvRows = rows.map(i => {
    const c = clientByCode(i.clientCode), comp = complianceById(i.complianceId);
    const risk = computeClientRisk(c.code, i.period, INSTANCES, DEMANDS, NOTICES);
    const valueFor = { client:c.name, compliance:comp.name, dueDate:i.dueDate, dataStatus:i.dataStatus, workingStatus:i.workingStatus, filingStatus:i.filingStatus, filingDate:i.filingDate || '', ackNo:i.ackNo || '', spoc:i.spoc, risk:risk.level };
    return activeCols.map(([k]) => valueFor[k]);
  });
  const csv = [header, ...csvRows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `compliance-register-${periodKey(state.period)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.exportDialogOpen = false;
  renderExportDialog();
  toast('Export generated');
}

/* ---------- FY CHANGE ---------- */
function handleFYChange(fyStr) {
  const parts = fyStr.match(/FY (\d{4})-(\d{2})/);
  const startY = Number(parts[1]);
  const targetFY = { start: startY, end: startY + 1 };
  state.fy = fyStr;
  const curFY = fyOf(state.period);
  if (curFY.start !== targetFY.start) {
    const todayFY = fyOf(CURRENT_PERIOD);
    state.period = todayFY.start === targetFY.start ? { ...CURRENT_PERIOD } : { y: targetFY.start, m: 4 };
  }
  renderApp();
}

/* ---------- MASTER DISPATCH ---------- */
function switchTab(tab) { state.activeTab = tab; renderApp(); }

function handleAction(action, target) {
  const d = target.dataset;
  switch (action) {
    case 'switchTab': switchTab(d.tab); break;
    case 'togglePeriodPopover': state.periodPopoverOpen = !state.periodPopoverOpen; state.periodPopoverYear = state.period.y; renderHeader(); break;
    case 'ppYear': state.periodPopoverYear += Number(d.delta); renderPeriodPopover(); break;
    case 'setPeriod': setPeriod({ y: Number(d.y), m: Number(d.m) }); state.periodPopoverOpen = false; renderApp(); break;
    case 'setPeriodDirect': setPeriod({ y: Number(d.y), m: Number(d.m) }); renderApp(); break;
    case 'shiftPeriod': setPeriod(shiftPeriod(state.period, Number(d.delta))); renderApp(); break;
    case 'gotoToday': setPeriod({ ...CURRENT_PERIOD }); state.periodPopoverOpen = false; renderApp(); break;
    case 'gotoTodayAction': state.activeTab = 'dashboard'; renderApp(); break;
    case 'gotoFollowups': state.activeTab = 'followups'; renderApp(); break;
    case 'gotoNotificationsSettings': state.activeTab = 'settings'; settingsActiveSection = 'notifications'; renderApp(); break;
    case 'gotoSettingsHome': state.activeTab = 'settings'; renderApp(); break;
    case 'kpiClick':
      state.activeTab = 'compliance';
      if (d.bucket === 'criticalrisk') { state.filters.risk = 'critical'; state.filters.status = 'all'; }
      else { state.filters.status = d.bucket || 'all'; state.filters.risk = 'all'; }
      renderApp();
      if (d.bucket) toast(`Filtered to ${d.bucket === 'criticalrisk' ? 'Critical Risk' : STATUS_LABELS[d.bucket] || d.bucket}`);
      break;
    case 'setDashboardView':
      state.dashboardView = d.view;
      document.querySelectorAll('.dash-view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === d.view));
      renderDashboardViewContentInto();
      break;
    case 'filterByRisk': state.activeTab = 'compliance'; state.filters.risk = d.risk; state.filters.status = 'all'; renderApp(); break;
    case 'gotoCompliance': state.activeTab = 'compliance'; renderApp(); break;
    case 'todayChip':
      state.activeTab = 'compliance';
      state.filters.status = d.bucket || 'all';
      state.filters.dueWindow = d.duewindow || 'all';
      renderApp();
      break;
    case 'viewAllPriority':
      state.activeTab = 'compliance'; state.sort = { key:'risk', dir:'desc' };
      renderApp();
      break;
    case 'openDrawer': openDrawer(d.instance); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'saveDrawer': saveDrawer(); break;
    case 'toggleRiskReasons': document.getElementById('drawerRiskReasons').classList.toggle('open'); break;
    case 'gotoClientFromDrawer': closeDrawer(); state.activeTab = 'clients'; state.clientDetailCode = d.code; state.clientDetailTab = 'overview'; renderApp(); break;
    case 'closeStatusPopover': closeStatusPopover(); renderCompliance(); break;
    case 'quickSetStatus': quickSetStatus(d.dim, d.value); break;
    case 'viewFullFromPopover': { const id = state.statusPopoverInstanceId; closeStatusPopover(); openDrawer(id); break; }
    case 'closeNoteModal': closeNoteModal(); break;
    case 'saveNote': saveNote(); break;
    case 'openClientForm': openClientForm(null); break;
    case 'editClient': openClientForm(d.code); break;
    case 'closeClientForm': closeClientForm(); break;
    case 'saveClientForm': saveClientForm(); break;
    case 'toggleClientActive': {
      const c = toggleClientActiveStatus(d.code);
      if (c) { toast(`${c.name} ${c.active ? 'activated' : 'deactivated'}`); renderClients(); }
      break;
    }
    case 'sortBy':
      if (state.sort.key === d.key) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      else state.sort = { key: d.key, dir: d.key === 'risk' ? 'desc' : 'asc' }; // risk: highest first by default
      renderCompliance();
      break;
    case 'openFilterPanel': openFilterPanel(d.context || 'tracker'); break;
    case 'closeFilterPanel': state.filterPanelOpen = false; renderFilterPanel(); break;
    case 'clearFilter': state.filters[d.key] = 'all'; renderApp(); break;
    case 'clearAllFilters': clearFilterState(); renderApp(); break;
    case 'toggleHeaderFilter': state.headerFilterOpen = state.headerFilterOpen === d.filterkey ? null : d.filterkey; renderCompliance(); break;
    case 'setHeaderFilter': state.filters[d.filterkey] = d.value; state.headerFilterOpen = null; renderApp(); break;
    case 'setQuickChip': state.filters.status = d.status === 'all' ? 'all' : d.status; renderApp(); break;
    case 'applyFilterPanel': applyFilterPanelValues(); break;
    case 'openExport': state.exportDialogOpen = true; renderExportDialog(); break;
    case 'closeExport': state.exportDialogOpen = false; renderExportDialog(); break;
    case 'generateExport': generateExport(); break;
    case 'openReraImport': state.reraImportOpen = true; renderReraImportModal(); break;
    case 'closeReraImport': state.reraImportOpen = false; renderReraImportModal(); break;
    case 'openClient360': state.clientDetailCode = d.code; state.clientDetailTab = 'overview'; renderClients(); break;
    case 'backToClients': state.clientDetailCode = null; renderClients(); break;
    case 'setClientTab': state.clientDetailTab = d.tab; renderClient360Tab(clientByCode(state.clientDetailCode), computeClientRisk(state.clientDetailCode, state.period, INSTANCES, DEMANDS, NOTICES)); document.querySelectorAll('.c360-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === d.tab)); break;
    case 'setTaxMattersTab': state.taxMattersSubtab = d.tab; renderTaxMatters(); break;
    case 'gotoTaxMatters': state.activeTab = 'taxmatters'; renderApp(); break;
    case 'selectReport': state.selectedReport = d.report; renderReports(); break;
    case 'setSettingsSection': settingsActiveSection = d.section; renderSettings(); break;
    case 'setTheme': state.theme = d.theme; applyTheme(); renderSettingsBody(); break;
    case 'setMasterSection': state.masterSection = d.section; renderMasters(); break;
    case 'addMasterEntry': {
      const label = target.closest('button').textContent.replace('+ Add ', '');
      const name = window.prompt(`Enter new ${label} name:`);
      if (name && addMasterEntry(d.masterkey, name)) { toast(`${name.trim()} added`); renderMastersBody(); }
      else if (name) toast('That name already exists');
      break;
    }
    case 'toggleMasterActive': {
      const item = toggleMasterActive(d.masterkey, d.name);
      if (item) { toast(`${d.name} ${item.active ? 'activated' : 'deactivated'}`); renderMastersBody(); }
      break;
    }
    case 'toggleComplianceActive': {
      const c = complianceById(d.id);
      if (c) { c.active = !c.active; toast(`${c.name} ${c.active ? 'activated' : 'deactivated'}`); renderMastersBody(); }
      break;
    }
    case 'toggleUserActive': {
      const u = USERS.find(x => x.id === d.id);
      if (u && u.id !== state.currentUser.id) { u.active = !u.active; toast(`${u.name} ${u.active ? 'activated' : 'deactivated'}`); renderMastersBody(); }
      break;
    }
    case 'cyclePermission': {
      const cur = PERMISSION_MATRIX.data[d.row][d.col];
      const next = PERM_LEVELS[(PERM_LEVELS.indexOf(cur) + 1) % PERM_LEVELS.length];
      PERMISSION_MATRIX.data[d.row][d.col] = next;
      toast(`${d.row} · ${d.col} set to ${next}`);
      renderMastersBody();
      renderApp(); // permission changes can affect nav visibility immediately
      break;
    }
    case 'noop': break;
    case 'logout': logout(); break;
    case 'toggleUserMenu': state.userMenuOpen = !state.userMenuOpen; renderHeader(); break;
    case 'enableNotifications': enableNotifications(); renderDashboard(); if (state.activeTab === 'settings') renderSettingsBody(); break;
    case 'toggleNotificationPolicy': toggleNotificationPolicy(d.key); renderSettingsBody(); renderDashboard(); break;
    case 'broadcastTestNotification': broadcastTestNotification(); break;
    case 'savePushServerConfig':
      savePushServerConfig(document.getElementById('pushServerUrlInput').value, document.getElementById('pushAdminKeyInput').value)
        .then(() => renderSettingsBody());
      break;
    case 'installPwa':
      if (pwaInstallPrompt) {
        pwaInstallPrompt.prompt();
        pwaInstallPrompt.userChoice.finally(() => { pwaInstallPrompt = null; renderHeader(); });
      }
      break;
  }
}

  if (e.target.id === 'exportOverlay') { state.exportDialogOpen = false; renderExportDialog(); return; }
  if (e.target.id === 'reraImportOverlay') { state.reraImportOpen = false; renderReraImportModal(); return; }
  if (e.target.id === 'statusPopoverOverlay') { closeStatusPopover(); renderCompliance(); return; }
  if (e.target.id === 'noteModalOverlay') { closeNoteModal(); return; }
  if (e.target.id === 'clientFormOverlay') { closeClientForm(); return; }
  const target = e.target.closest('[data-action]');
  if (!target) {
    if (state.periodPopoverOpen && !e.target.closest('.period-popover') && !e.target.closest('#periodBtn')) { state.periodPopoverOpen = false; renderHeader(); }
    if (state.userMenuOpen && !e.target.closest('.user-chip')) { state.userMenuOpen = false; renderHeader(); }
    return;
  }
  handleAction(target.dataset.action, target);
});

  if (document.getElementById('drawerOverlay').classList.contains('open')) closeDrawer();
  if (state.filterPanelOpen) { state.filterPanelOpen = false; renderFilterPanel(); }
  if (state.exportDialogOpen) { state.exportDialogOpen = false; renderExportDialog(); }
  if (state.reraImportOpen) { state.reraImportOpen = false; renderReraImportModal(); }
  if (document.getElementById('statusPopoverOverlay').classList.contains('open')) { closeStatusPopover(); renderCompliance(); }
  if (document.getElementById('noteModalOverlay').classList.contains('open')) closeNoteModal();
  if (document.getElementById('clientFormOverlay').classList.contains('open')) closeClientForm();
});
// Header filter dropdowns aren't inside a modal overlay, so they need their
// own outside-click dismissal rather than reusing the overlay-click pattern.
document.addEventListener('click', e => {
  if (state.headerFilterOpen && !e.target.closest('.th-filter-wrap')) {
    state.headerFilterOpen = null;
    if (document.getElementById('page-compliance').classList.contains('active')) renderCompliance();
  }
});

/* ---------- APP RENDER DISPATCH ---------- */
function renderApp() {
  if (!state.currentUser) { showLoginScreen(); return; }
  showAppShell();
  renderHeader();
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + state.activeTab));
  renderDashboard();
  renderCompliance();
  renderClients();
  renderTaxMatters();
  renderFollowUps();
  renderRera();
  renderReports();
  renderMasters();
  renderSettings();
  renderFilterPanel();
  renderExportDialog();
  renderReraImportModal();
}

/* ---------- LOGIN ---------- */
function showLoginScreen() {
  document.getElementById('appShellRoot').style.display = 'none';
  const el = document.getElementById('loginScreen');
  el.style.display = 'flex';
  el.innerHTML = `
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark" style="width:64px;height:64px;background:var(--indigo); border-radius:12px; padding:8px;">
          <img src="${JAC_LOGO_B64}" alt="JAC" style="height:100%; width:auto;">
        </div>
        <div>
          <h1 style="font-size:18px;">JACPOT</h1>
          <p style="margin:2px 0 0; font-size:12px; color:var(--ink-soft);">Proactive Operations Tracker</p>
        </div>
      </div>
      <form id="loginForm">
        <div class="field" style="margin-bottom:12px;"><label>User ID</label><input type="text" id="loginId" autocomplete="username" placeholder="e.g. UMANG"></div>
        <div class="field" style="margin-bottom:6px;"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
        ${state.loginError ? `<div class="login-error">${state.loginError}</div>` : ''}
        <button type="submit" class="btn primary block" style="margin-top:14px; padding:10px;">Login</button>
      </form>
      <div class="login-demo-hint">Demo Login — try UMANG, RAVI, ANUSHKA or JYOTI · password <span class="mono">demo123</span> for all. Front-end prototype only, not production authentication.</div>
    </div>
  `;
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    attemptLogin(document.getElementById('loginId').value, document.getElementById('loginPassword').value);
  });
  document.getElementById('loginId').focus();
}
function showAppShell() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShellRoot').style.display = '';
}
function attemptLogin(id, password) {
  const trimmed = (id || '').trim();
  const user = userByLoginId(trimmed);
  if (!user) { state.loginError = 'User ID not found.'; renderApp(); return; }
  if (!user.active) { state.loginError = 'This account has been deactivated.'; renderApp(); return; }
  if (user.password !== password) { state.loginError = 'Incorrect password.'; renderApp(); return; }
  state.loginError = '';
  state.currentUser = { id: user.id, name: user.name, role: user.role };
  state.activeTab = canSeeNav('dashboard') ? 'dashboard' : (currentPerms().nav[0] || 'dashboard');
  toast(`Welcome, ${user.name}`);
  renderApp();
  checkRedFlags(); // establishes this session's baseline silently on first call
  fireDueDateDigest();
}
function logout() {
  state.currentUser = null;
  state.userMenuOpen = false;
  state.loginError = '';
  renderApp();
}

renderApp();
applyTheme();
wireSwipeDismiss();
// On phone-width screens, only the compliance part of the app is available —
// land on Dashboard if the app happened to open on a desktop-only tab.
if (typeof window !== 'undefined' && window.innerWidth <= 720 && !['dashboard', 'compliance'].includes(state.activeTab)) {
  state.activeTab = 'dashboard';
  renderApp();
}

</script>
</body>
</html>
